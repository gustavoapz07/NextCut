# Revisiones de cada PR y de cada push a main (docs/plan-implementacion.md, sección 11).
# Las pruebas de la base (pgTAP y concurrencia) corren con Supabase local; Playwright llega en el
# Sprint 2.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # En push y PR, gitleaks revisa solo los commits nuevos. La ejecución manual y la semanal
  # (lunes 3:00 a. m. en Honduras) revisan todo el historial.
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          LEFTHOOK: 0

      - name: Lint y formato (Biome)
        run: npx biome ci .

      - name: Tipos (TypeScript 7)
        run: npm run typecheck

      - name: Pruebas unitarias (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: El build no contiene claves secretas (fallo 1)
        run: |
          if grep -rEl "sb_secret_|service_role" dist/; then
            echo "::error::El build contiene una clave secreta o una referencia a service_role."
            exit 1
          fi

  base:
    name: Base de datos (pgTAP y concurrencia)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          LEFTHOOK: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Solo lo que usan las pruebas: Postgres, Auth, Realtime y la API (ADR-008: sin Docker en
      # la laptop, pero los runners de GitHub sí lo tienen).
      - name: Levantar Supabase local
        run: >-
          supabase start
          -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,mailpit,supavisor,postgres-meta

      - name: Pruebas de la base (pgTAP, fallos 2, 3, 5, 7, 9 y 10)
        run: supabase test db

      - name: Concurrencia (fallo 8)
        run: npm run test:concurrencia

      - name: Apagar Supabase
        if: always()
        run: supabase stop --no-backup

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
